<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f7f7f8;
      color: #111827;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 0;
      background: #111827;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button.secondary {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .status {
      font-size: 13px;
      margin-top: 8px;
      color: #374151;
    }

    pre {
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 11px;
      background: #111827;
      color: #d1d5db;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>ReactBuilder Importer</h2>
    <p>Connect once, choose a site, then send your selected frame.</p>

    <input
      id="pluginTokenInput"
      type="password"
      placeholder="Paste Figma Plugin Token"
    />

    <button id="connectBtn" class="secondary">
      Connect
    </button>

    <select id="siteSelect">
      <option value="">Select site...</option>
    </select>

    <button id="exportBtn">
      Analyze Selected Frame
    </button>

    <button id="sendBtn" class="secondary">
      Send To ReactBuilder
    </button>

    <div id="status" class="status">
      Paste plugin token to connect.
    </div>
  </div>

  <div class="card">
    <p>Preview payload</p>
    <pre id="result">{}</pre>
  </div>

  <script>
    const API_URL =
      "https://backend-rmfq.onrender.com";

    let lastPayload = null;

    const statusEl =
      document.getElementById("status");

    const resultEl =
      document.getElementById("result");

    const pluginTokenInput =
      document.getElementById("pluginTokenInput");

    const siteSelect =
      document.getElementById("siteSelect");

    const setStatus = (message) => {
      statusEl.textContent = message;
    };

    const savePluginSettings = () => {
      parent.postMessage(
        {
          pluginMessage: {
            type: "SAVE_PLUGIN_SETTINGS",
            pluginToken: pluginTokenInput.value.trim(),
            siteId: siteSelect.value || ""
          }
        },
        "*"
      );
    };

    const renderSites = (sites) => {
      siteSelect.innerHTML =
        '<option value="">Select site...</option>';

      sites.forEach((site) => {
        const option =
          document.createElement("option");

        option.value = String(site.id);
        option.textContent =
          site.name + " (#" + site.id + ")";

        siteSelect.appendChild(option);
      });

      const savedSiteId =
        siteSelect.dataset.savedSiteId;

      if (savedSiteId) {
        siteSelect.value = savedSiteId;
      }
    };

    document.getElementById("connectBtn").onclick =
      async () => {
        const token =
          pluginTokenInput.value.trim();

        if (!token) {
          setStatus("Paste plugin token first.");
          return;
        }

        try {
          setStatus("Connecting...");

          const response = await fetch(
            API_URL + "/api/figma-plugin/sites",
            {
              headers: {
                Authorization: "Bearer " + token
              }
            }
          );

          console.log("STATUS", response.status);

          const result =
            await response.json();

          console.log("RESULT", result);

          resultEl.textContent =
            JSON.stringify(result, null, 2);

          if (!response.ok || !result.success) {
            setStatus(
              result.message || "Connection failed."
            );
            return;
          }

          renderSites(result.data || []);
          savePluginSettings();

          setStatus("Connected. Select a site.");
        } catch (error) {
  console.error("FIGMA_CONNECT_ERROR", error);

  setStatus("Connection failed.");

  resultEl.textContent =
    error instanceof Error
      ? `${error.name}: ${error.message}`
      : String(error);
}
      };

    siteSelect.onchange = () => {
      savePluginSettings();
    };

    document.getElementById("exportBtn").onclick =
      () => {
        setStatus("Analyzing selected frame...");

        parent.postMessage(
          {
            pluginMessage: {
              type: "EXPORT_SELECTION"
            }
          },
          "*"
        );
      };

    document.getElementById("sendBtn").onclick =
      () => {
        const token =
          pluginTokenInput.value.trim();

        const siteId =
          siteSelect.value;

        if (!token) {
          setStatus("Paste plugin token first.");
          return;
        }

        if (!siteId) {
          setStatus("Select a site first.");
          return;
        }

        savePluginSettings();

        setStatus("Sending selected frame...");

        parent.postMessage(
          {
            pluginMessage: {
              type: "SEND_TO_REACTBUILDER",
              pluginToken: token,
              siteId
            }
          },
          "*"
        );
      };

    window.onmessage = (event) => {
      const msg =
        event.data.pluginMessage;

      if (!msg) {
        return;
      }

      resultEl.textContent =
        JSON.stringify(msg, null, 2);

      if (msg.type === "STORAGE_LOADED") {
        pluginTokenInput.value =
          msg.pluginToken || "";

        if (msg.selectedSiteId) {
          siteSelect.dataset.savedSiteId =
            msg.selectedSiteId;
        }

        if (msg.pluginToken) {
          setStatus("Saved token loaded. Click Connect.");
        }
      }

      if (msg.type === "PLUGIN_SETTINGS_SAVED") {
        setStatus("Plugin settings saved.");
      }

      if (msg.type === "EXPORT_RESULT") {
        lastPayload =
          msg.payload;

        setStatus(
          "Frame analyzed: " +
          msg.payload.name +
          " (" +
          msg.payload.type +
          ")"
        );
      }

      if (msg.type === "SEND_RESULT") {
        if (msg.payload && msg.payload.success) {
          setStatus("Sent to ReactBuilder successfully.");
        } else {
          setStatus(
            msg.payload?.message || "Send failed."
          );
        }
      }

      if (msg.type === "ERROR") {
        setStatus(msg.message);
      }
    };
  </script>
</body>
</html>
